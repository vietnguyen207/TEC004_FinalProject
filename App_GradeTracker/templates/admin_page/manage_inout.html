<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTrack - Import/Export Module</title>

    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_page/export_import.css') }}">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="/admin" class="nav-brand">
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
            <span>StudyTrack</span>
        </a>
        <a href="/admin" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- PAGE HEADER -->
        <div class="page-header">
            <!-- Dùng một icon lớn hoặc ảnh minh họa chung -->
            <img src="{{ url_for('static', filename='gif image/Life Work GIF by Patrick Doyon.gif') }}"
                alt="Import Export Animation" width="200">
            <h1 class="page-title">Import / Export Module</h1>
        </div>

        <!-- IMPORT CSV PANEL -->
        <div class="card-panel">
            <h2 class="panel-title"><i class="fa-solid fa-file-csv"></i> Import CSV Files</h2>
            <form action="/import_csv" method="POST" enctype="multipart/form-data">
                <div class="file-upload-wrapper">
                    <input type="file" name="csv_files" accept=".csv" multiple class="file-input" required>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-upload"></i> Process CSV Files
                </button>
            </form>
        </div>

        <!-- IMPORT RESULT PANEL -->
        <div class="card-panel">
            <h2 class="panel-title"><i class="fa-solid fa-chart-pie"></i> Import Result Summary</h2>
            <div class="stats-grid">

                <div class="stat-box stat-imported">
                    <p class="stat-label">Imported</p>
                    <p class="stat-value">
                        <!-- Sử dụng Jinja2 để render dữ liệu từ Backend -->
                        {{ imported if imported is defined else 0 }}
                    </p>
                </div>

                <div class="stat-box stat-updated">
                    <p class="stat-label">Updated</p>
                    <p class="stat-value">
                        {{ updated if updated is defined else 0 }}
                    </p>
                </div>

                <div class="stat-box stat-skipped">
                    <p class="stat-label">Skipped</p>
                    <p class="stat-value">
                        {{ skipped if skipped is defined else 0 }}
                    </p>
                </div>

            </div>
        </div>

        <!-- EXPORT REPORT PANEL -->
        <div class="card-panel">
            <h2 class="panel-title"><i class="fa-solid fa-file-export"></i> Export Report</h2>
            <a href="/export_json" style="text-decoration: none;">
                <button type="button" class="btn-primary btn-export">
                    <i class="fa-solid fa-download"></i> Download JSON Report
                </button>
            </a>
        </div>

    </div>

</body>

</html>
