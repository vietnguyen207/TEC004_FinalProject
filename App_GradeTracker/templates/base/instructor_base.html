<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Portal - StudyTrack</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Base chung -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/instructor_page/dashboard.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <a href="{{ url_for('instructor.dashboard') }}" class="sidebar-brand">
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
            <span>Instructor Portal</span>
        </a>

        <nav class="sidebar-nav">
            <a href="{{ url_for('instructor.dashboard') }}" class="nav-item active">
                <i class="fa-solid fa-house nav-icon"></i>
                <span>Dashboard</span>
            </a>

            <a href="{{ url_for('instructor.my_courses') }}" class="nav-item">
                <i class="fa-solid fa-book-open nav-icon"></i>
                <span>My Courses</span>
            </a>

            <hr class="sidebar-divider">

            <a href="{{ url_for('auth.logout') }}" class="nav-item logout-btn">
                <i class="fa-solid fa-right-from-bracket nav-icon"></i>
                <span>Logout</span>
            </a>
        </nav>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        <!-- TOPBAR -->
        <header class="topbar">
            <div class="user-pill">
                <span>Welcome, <strong>{{ session["username"] }}</strong></span>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="content-area">
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>

</html>
