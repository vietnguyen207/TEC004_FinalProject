{% extends "base/instructor_base.html" %}

{% block content %}
<div class="create-assignment-container">
    
    <!-- PAGE HEADER -->
    <div class="page-header flex-between">
        <div>
            <span class="badge-tag">
                <i class="fa-solid fa-pen-to-square"></i> Course Management
            </span>
            <h1 class="page-title">Edit Assignment</h1>
            <p class="page-subtitle">Update details, schedule, or maximum points for this assignment.</p>
        </div>

        <a href="{{ url_for('instructor.assignments', course_id=assignment.course_id if assignment.course_id else course_id) }}" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Back to Assignments
        </a>
    </div>

    <!-- MAIN FORM CARD -->
    <div class="panel-card form-card-wide">
        <div class="panel-header">
            <div class="panel-title-group">
                <h2>Edit Details: <span style="color: #38bdf8;">{{ assignment.assignment_name }}</span></h2>
            </div>
            <span class="weight-note"><i class="fa-solid fa-circle-info"></i> Make sure to save your changes</span>
        </div>

        <form method="POST" class="custom-form">
            
            <!-- ROW 1: Name & Type -->
            <div class="form-grid-2">
                <div class="form-group">
                    <label for="assignment_name" class="form-label">
                        <i class="fa-solid fa-pen-to-square"></i> Assignment Name <span class="required-asterisk">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="assignment_name"
                        name="assignment_name" 
                        class="form-control"
                        value="{{ assignment.assignment_name }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="assignment_type" class="form-label">
                        <i class="fa-solid fa-layer-group"></i> Assignment Type
                    </label>
                    <div class="select-wrapper">
                        <select name="assignment_type" id="assignment_type" class="form-control" required>
                            <option value="assignment" {% if assignment.assignment_type == "assignment" %}selected{% endif %}>
                                Assignment
                            </option>
                            <option value="midterm" {% if assignment.assignment_type == "midterm" %}selected{% endif %}>
                                Midterm Exam
                            </option>
                            <option value="final" {% if assignment.assignment_type == "final" %}selected{% endif %}>
                                Final Exam
                            </option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-icon"></i>
                    </div>
                </div>
            </div>

            <!-- ROW 2: Description -->
            <div class="form-group">
                <label for="description" class="form-label">
                    <i class="fa-solid fa-align-left"></i> Description / Instructions
                </label>
                <textarea 
                    id="description"
                    name="description" 
                    rows="5" 
                    class="form-control textarea-control"
                    placeholder="Describe the instructions, requirements, and submission guidelines...">{% if assignment.description and assignment.description != 'None' %}{{ assignment.description }}{% endif %}</textarea>
            </div>

            <!-- ROW 3: Due Date & Max Points -->
            <div class="form-grid-2">
                <div class="form-group">
                    <label for="due_date" class="form-label">
                        <i class="fa-regular fa-calendar-days"></i> Due Date <span class="required-asterisk">*</span>
                    </label>
                    <input 
                        type="date" 
                        id="due_date"
                        name="due_date" 
                        class="form-control date-picker"
                        value="{{ assignment.due_date }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="max_points" class="form-label">
                        <i class="fa-solid fa-award"></i> Maximum Points <span class="required-asterisk">*</span>
                    </label>
                    <div class="input-with-suffix">
                        <input 
                            type="number" 
                            step="0.1" 
                            min="0"
                            id="max_points"
                            name="max_points" 
                            class="form-control"
                            value="{{ assignment.max_points }}"
                            required>
                        <span class="input-suffix">pts</span>
                    </div>
                </div>
            </div>

            <!-- FORM ACTIONS -->
            <div class="form-actions align-right">
                <a href="{{ url_for('instructor.assignments', course_id=assignment.course_id if assignment.course_id else course_id) }}" class="btn-cancel">
                    Cancel
                </a>
                <button type="submit" class="btn-save">
                    <i class="fa-solid fa-floppy-disk"></i> Save Changes
                </button>
            </div>

        </form>
    </div>

</div>
{% endblock %}
