<h2>Attendance Management</h2>

<table border="1">

<tr>

<th>Course ID</th>
<th>Course Name</th>
<th>Semester</th>
<th>Sessions</th>
<th></th>

</tr>

{% for c in courses %}

<tr>

<td>{{ c.course_id }}</td>

<td>{{ c.course_name }}</td>

<td>{{ c.semester }}</td>

<td>{{ c.sessions }}</td>

<td>

<a href="{{ url_for('admin.attendance_course',
course_id=c.course_id) }}">

Open

</a>

</td>

</tr>

{% endfor %}

</table>
