<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
</head>
<body>

<h1>Student Management</h1>

<form method="POST">

    <input
    type="text"
    name="id"
    placeholder="Student ID"
    value="{{ student.id if student else '' }}"
    class="{% if error_student_id %}error{% endif %}"
    required>
    {% if error_student_id %}
        <div class="error-message">
            {{ error_student_id }}
        </div>
    {% endif %}
    <br><br>

    <input
        type="text"
        name="name"
        placeholder="Name"
        value="{{ student.name if student else '' }}"
        required>
    <br><br>

    <input
        type="text"
        name="email"
        placeholder="Email"
        value="{{ student.email if student else '' }}"
        required>

    <br><br>

    <input
        type="text"
        name="major"
        placeholder="Major"
        value="{{ student.major if student else '' }}"
        required>

    <br><br>

    <button type="submit">
        Add Student
    </button>

</form>

<hr>

<h2>Student List</h2>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Major</th>
</tr>

{% for s in students %}

<tr>
    <td>{{ s[0] }}</td>
    <td>{{ s[1] }}</td>
    <td>{{ s[2] }}</td>
    <td>{{ s[3] }}</td>
</tr>

{% endfor %}

</table>
<a href="/admin">Back Home</a>
</body>
</html>
