<form method="POST">

    <label>Course ID</label>
    <input
        type="text"
        name="id"
        value="{{ course.id if course else '' }}"
        class="{% if error_course_id %}error{% endif %}"
        required
    >

    {% if error_course_id %}
        <div class="error-message">
            {{ error_course_id }}
        </div>
    {% endif %}

    <br>

    <label>Course Name</label>
    <input
        type="text"
        name="name"
        value="{{ course.name if course else '' }}"
        required
    >

    <br>

    <label>Credits</label>
    <input
        type="number"
        name="credits"
        value="{{ course.credits if course else '' }}"
        required
    >

    <br>
    <label> Semester </label>
    <input
        type = "text"
        name = "semester"
        value="{{ course.semester if course else '' }}"
        required
    >
    <label> Number of Sessions </label>
    <input
        type = "number"
        name = "sessions"
        value="{{ course.sessions if course else '' }}"
        required
    >
    <button type="submit">Add Course</button>

</form>
<a href="/">Back Home</a>
