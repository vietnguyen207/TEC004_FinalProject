<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static',filename='css/login.css') }}">

</head>

<body>

<div class="login-box">

<h1>Student Management System</h1>

<form method="POST">

<label>Login As</label>

<select name="role">

    <option value="admin">
        Admin
    </option>

    <option value="instructor">
        Instructor
    </option>

    <option value="student">
        Student
    </option>

</select>

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button>

Login

</button>

</form>

{% if error %}

<p style="color:red">

{{ error }}

</p>

{% endif %}

</div>

</body>

</html>
