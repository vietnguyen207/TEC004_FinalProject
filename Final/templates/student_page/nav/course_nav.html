<div class="course-header">

    <div class="course-title">

        <h2>{{ course.course_name }}</h2>

        <p>

            <strong>ID:</strong> {{ course.course_id }}

            |

            <strong>Semester:</strong> {{ course.semester }}

            |

            <strong>Credits:</strong> {{ course.credits }}

            |

            <strong>Sessions:</strong> {{ course.sessions }}

        </p>

    </div>

</div>

<div class="course-nav">

    <a class="{% if request.endpoint=='student.course_dashboard' %}active{% endif %}"
       href="{{ url_for('student.course_dashboard',
       course_id=course.course_id) }}">

        🏠 Overview

    </a>

    <a class="{% if request.endpoint=='student.attendance' %}active{% endif %}"
       href="{{ url_for('student.attendance',
       course_id=course.course_id) }}">

        📅 Attendance

    </a>

    <a class="{% if request.endpoint=='student.grades' %}active{% endif %}"
       href="{{ url_for('student.grades',
       course_id=course.course_id) }}">

        📝 Grades

    </a>

    <a class="{% if request.endpoint=='student.attendance_report_page' %}active{% endif %}"
       href="{{ url_for('student.attendance_report_page',
       course_id=course.course_id) }}">

        📊 Attendance Report

    </a>

    <a class="{% if request.endpoint=='student.grade_report_page' %}active{% endif %}"
       href="{{ url_for('student.grade_report_page',
       course_id=course.course_id) }}">

        📈 Grade Report

    </a>
    <a
    class="{% if request.endpoint=='student.assignments' %}active{% endif %}"
    href="{{ url_for('student.assignments',
    course_id=course.course_id) }}"
    >

        📝 Assignments

    </a>
</div>
