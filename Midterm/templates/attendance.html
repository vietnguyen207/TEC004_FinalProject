<!DOCTYPE html>
<html>

<head>

<title>

Attendance Management

</title>

<style>

body{
    font-family:Arial;
    margin:40px;
}

.card{
    border:1px solid #ddd;
    padding:20px;
    margin-bottom:20px;
}

input,
select{

    padding:8px;
    margin:5px;
}

button{

    padding:10px;
}

.result{

    font-size:20px;
    font-weight:bold;
    color:green;
}

</style>

</head>

<body>

<h1>

Attendance Management

</h1>

{% if message %}

<p class="result">

{{ message }}

</p>

{% endif %}

<div class="card">

<h2>

Mark Attendance

</h2>

<form
action="/attendance/mark"
method="POST"
>

<input
type="text"
name="student_id"
placeholder="Student ID"
required
>

<input
type="text"
name="course_id"
placeholder="Course ID"
required
>

<input
type="number"
name="session_number"
placeholder="Session Number"
required
>

<select name="status">

<option value="Present">

Present

</option>

<option value="Absent">

Absent

</option>

</select>

<button type="submit">

Save Attendance

</button>

</form>

</div>

<hr>

<div class="card">

<h2>

Attendance Report

</h2>

<a href="/attendance/report">

View Report

</a>

</div>



</body>

</html>
