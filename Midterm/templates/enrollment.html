<h1>Enrollment</h1>

<form method="POST">

<select name="student_id">

{% for s in students %}
<option value="{{s[0]}}">
    {{s[1]}}
</option>
{% endfor %}

</select>

<select name="course_id">

{% for c in courses %}
<option value="{{c[0]}}">
    {{c[1]}}
</option>
{% endfor %}

</select>
<select name="instructor_id">

{% for i in instructors %}  
<option value="{{i[0]}}">
    {{i[1]}}
</option>
{% endfor %}
</select>
<button>
Enroll
</button>

</form>

<hr>

<table border="1">

<tr>
<th>Number</th>
<th>ID</th>
<th>Student</th>
<th>Course</th>
<th>Instructor</th>
</tr>

{% for e in enrollments %}

<tr>
<td>{{e[0]}}</td>
<td>{{e[1]}}</td>
<td>{{e[2]}}</td>
<td>{{e[3]}}</td>
<td>{{e[4]}}</td>
</tr>

{% endfor %}

</table>
<a href="/">Back Home</a>
