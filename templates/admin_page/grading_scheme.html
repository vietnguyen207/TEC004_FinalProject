<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTrack - Grade Scheme</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_page/grading_scheme.css') }}">
</head>

<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="/admin" class="nav-brand">
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
            <span>StudyTrack</span>
        </a>
        <a href="/admin" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </header>

    <div class="container">
        <!-- Page Header -->
        <div class="page-header" style="display: flex; align-items: center; gap: 15px;">
            <img src="{{ url_for('static', filename='gif image/Great Job Success GIF by Fugz Official.gif') }}"
                alt="Ảnh động A+" width="100">
            <div>
                <h1 class="page-title">
                    Instructor : <span class="instructor-id-highlight">{{ instructor_id }}</span>
                </h1>
                <p class="page-subtitle">Configure percentage weightings for course grades</p>
            </div>
        </div>

        <!-- Grade Scheme Table Form -->
        <div class="card-panel">
            <h2 class="panel-title"><i class="fa-solid fa-sliders"></i> Course Grade Weights</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 35%;">Course</th>
                            <th style="text-align: center;">Assignment %</th>
                            <th style="text-align: center;">Midterm %</th>
                            <th style="text-align: center;">Final %</th>
                            <th style="text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for c in courses %}
                        <form method="POST">
                            <tr>
                                <td>
                                    <b>{{ c["course_name"] }}</b>
                                    <input type="hidden" name="course_id" value="{{ c['course_id'] }}">
                                </td>
                                <td style="text-align: center;">
                                    <input type="number" name="assignment" value="{{ c['assignment_weight'] or 0 }}"
                                        min="0" max="100" class="input-score">
                                </td>
                                <td style="text-align: center;">
                                    <input type="number" name="midterm" value="{{ c['midterm_weight'] or 0 }}" min="0"
                                        max="100" class="input-score">
                                </td>
                                <td style="text-align: center;">
                                    <input type="number" name="final" value="{{ c['final_weight'] or 0 }}" min="0"
                                        max="100" class="input-score">
                                </td>
                                <td style="text-align: center;">
                                    <button type="submit" class="btn-save">
                                        <i class="fa-solid fa-floppy-disk"></i> Save
                                    </button>
                                </td>
                            </tr>
                        </form>
                        {% else %}
                        <tr>
                            <td colspan="5" class="empty-state">No courses found for this instructor.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>

</html>
