<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTrack - Course Management</title>

    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_page/managment_course.css') }}">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="/admin" class="nav-brand">
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
            <span>StudyTrack</span>
        </a>
        <a href="/admin" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- PAGE HEADER -->
        <div class="page-header" style="display: flex; align-items: center; gap: 15px;">
            <img src="{{ url_for('static', filename='gif image/Studying College Life GIF by University of Florida (1).gif') }}"
                alt="Studying Animation" width="100">
            <h1 class="page-title">Course Management</h1>
        </div>

        <!-- ADD / EDIT COURSE FORM PANEL -->
        <div class="card-panel">
            <h2 class="panel-title"><i class="fa-solid fa-book-medical"></i> Add New Course</h2>

            <form method="POST" class="form-grid">
                <!-- Course ID -->
                <div class="form-group">
                    <label>Course ID</label>
                    <input type="text" name="id" placeholder="e.g., CS101" value="{{ course.id if course else '' }}"
                        class="form-control {% if error_course_id %}error{% endif %}" required>
                    {% if error_course_id %}
                    <div class="error-message">
                        ❌ {{ error_course_id }}
                    </div>
                    {% endif %}
                </div>

                <!-- Course Name -->
                <div class="form-group">
                    <label>Course Name</label>
                    <input type="text" name="name" placeholder="e.g., Introduction to Programming"
                        value="{{ course.name if course else '' }}" class="form-control" required>
                </div>

                <!-- Credits -->
                <div class="form-group">
                    <label>Credits</label>
                    <input type="number" name="credits" min="1" placeholder="e.g., 3"
                        value="{{ course.credits if course else '' }}" class="form-control" required>
                </div>

                <!-- Semester -->
                <div class="form-group">
                    <label>Semester</label>
                    <input type="text" name="semester" placeholder="e.g., Fall 2026"
                        value="{{ course.semester if course else '' }}" class="form-control" required>
                </div>

                <!-- Number of Sessions -->
                <div class="form-group">
                    <label>Number of Sessions</label>
                    <input type="number" name="sessions" min="1" placeholder="e.g., 15"
                        value="{{ course.sessions if course else '' }}" class="form-control" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-plus"></i> Add Course
                </button>
            </form>
        </div>

        <!-- COURSE LIST TABLE PANEL -->
        <div class="card-panel">
            <h2 class="panel-title"><i class="fa-solid fa-list"></i> Course List</h2>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Credits</th>
                            <th>Semester</th>
                            <th>Sessions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for c in courses %}
                        <tr>
                            <td><b>{{ c[0] }}</b></td>
                            <td>{{ c[1] }}</td>
                            <td>{{ c[2] }}</td>
                            <td>{{ c[3] }}</td>
                            <td>{{ c[4] }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="5" class="empty-state">
                                No courses in the list.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>

</html>
