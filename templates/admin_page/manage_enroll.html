<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTrack - Enrollment Management</title>

    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_page/managment_enroll.css') }}">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="/admin" class="nav-brand">
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
            <span>StudyTrack</span>
        </a>
        <a href="/admin" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- PAGE HEADER -->
        <div class="page-header" style="display: flex; align-items: center; gap: 15px;">
            <img src="{{ url_for('static', filename='gif image/Studying College Life GIF by University of Florida (1).gif') }}"
                alt="Studying Animation" width="100">
            <h1 class="page-title">Enrollment Management</h1>
        </div>

        <!-- ENROLL FORM PANEL -->
        <div class="card-panel">
            <h2 class="panel-title"><i class="fa-solid fa-user-plus"></i> Add New Enrollment</h2>

            <form method="POST" class="form-grid">
                <!-- Select Student -->
                <div class="form-group">
                    <label>Student</label>
                    <select name="student_id" class="form-control" required>
                        <option value="" disabled selected>-- Select Student --</option>
                        {% for s in students %}
                        <option value="{{ s[0] }}">{{ s[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Select Course -->
                <div class="form-group">
                    <label>Course</label>
                    <select name="course_id" class="form-control" required>
                        <option value="" disabled selected>-- Select Course --</option>
                        {% for c in courses %}
                        <option value="{{ c[0] }}">{{ c[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Select Instructor -->
                <div class="form-group">
                    <label>Instructor</label>
                    <select name="instructor_id" class="form-control" required>
                        <option value="" disabled selected>-- Select Instructor --</option>
                        {% for i in instructors %}
                        <option value="{{ i[0] }}">{{ i[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-check"></i> Enroll Student
                </button>
            </form>
        </div>

        <!-- ENROLLMENT LIST TABLE PANEL -->
        <div class="card-panel">
            <h2 class="panel-title"><i class="fa-solid fa-list"></i> Enrollment List</h2>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Number</th>
                            <th>ID</th>
                            <th>Student</th>
                            <th>Course</th>
                            <th>Instructor</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for e in enrollments %}
                        <tr>
                            <td>{{ e[0] }}</td>
                            <td><b>{{ e[1] }}</b></td>
                            <td>{{ e[2] }}</td>
                            <td>{{ e[3] }}</td>
                            <td>{{ e[4] }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="5" class="empty-state">
                                No enrollments found.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>

</html>
