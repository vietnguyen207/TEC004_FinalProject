<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ===== 1. METADATA & CONFIGURATION ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTrack - Student Management</title>

    <!-- ===== 2. EXTERNAL FONTS & ICONS ===== -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ===== 3. CUSTOM STYLESHEET ===== -->
  
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_page/manage_student.css') }}">

</head>

<body>

    <!-- ========================================================= -->
    <!-- SECTION 1: HEADER & NAVIGATION BAR                        -->
    <!-- ========================================================= -->
    <header class="navbar">
  
        <a href="/admin" class="nav-brand">
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
            <span>StudyTrack</span>
        </a>

   
        <a href="/admin" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </header>

    <!-- ========================================================= -->
    <!-- SECTION 2: MAIN CONTENT CONTAINER                         -->
    <!-- ========================================================= -->
    <div class="container">

        <!-- ===== BLOCK A: PAGE HEADER WITH GIF ANIMATION ===== -->
        <div class="page-header" style="display: flex; align-items: center; gap: 15px;">
    
            <img src="{{ url_for('static', filename='gif image/Studying College Life GIF by University of Florida (1).gif') }}"
                alt="Studying Animation" width="100">
            <h1 class="page-title">Student Management</h1>
        </div>

        <!-- ===== BLOCK B: CARD PANEL - ADD NEW STUDENT FORM ===== -->
        <div class="card-panel">
            <h2 class="panel-title"><i class="fa-solid fa-user-plus"></i> Add New Student</h2>

       
            <form method="POST" class="form-grid">

            
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" name="id" placeholder="e.g., SV001" value="{{ student.id if student else '' }}"
                        class="form-control " required>

                 
                    {% if error_student_id %}
                    <div class="error-message">
                        ❌ {{ error_student_id }}
                    </div>
                    {% endif %}
                </div>

          
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="e.g., John Doe"
                        value="{{ student.name if student else '' }}" class="form-control" required>
                </div>

          
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="e.g., john.doe@gmail.com"
                        value="{{ student.email if student else '' }}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Major</label>
                    <input type="text" name="major" placeholder="e.g., Computer Science"
                        value="{{ student.major if student else '' }}" class="form-control" required>
                </div>

                
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-plus"></i> Add Student
                </button>

            </form>
        </div>

        <!-- ===== BLOCK C: CARD PANEL - STUDENT DATA TABLE ===== -->
        <div class="card-panel">
            <h2 class="panel-title"><i class="fa-solid fa-list"></i> Student List</h2>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Major</th>
                        </tr>
                    </thead>
                    <tbody>
             
                        {% for s in students %}
                        <tr>
                            <td><b>{{ s[0] }}</b></td>
                            <td>{{ s[1] }}</td>
                            <td>{{ s[2] }}</td>
                            <td>{{ s[3] }}</td>
                        </tr>
                        {% else %}
                 
                        <tr>
                            <td colspan="4" class="empty-state">
                                No students in the list.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>

</html>
