<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTrack - Visualization Reports</title>

    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_page/matplotlibvisual.css') }}">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="/admin" class="nav-brand">
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
            <span>StudyTrack</span>
        </a>
        <a href="/admin" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- PAGE HEADER -->
        <div class="page-header">
            <h1 class="page-title">Visualization Dashboard</h1>
            <p class="page-subtitle">Matplotlib Visual Reports & Analysis</p>
        </div>

        <!-- UNIFIED SEARCH BAR -->
        <div class="search-section">
            <form onsubmit="generateStudentCharts(event)" class="search-form">
                <label for="student-id-input"><i class="fa-solid fa-user-graduate"></i> Student ID:</label>
                <input type="text" id="student-id-input" placeholder="Enter Student ID to fetch GPA & Radar..."
                    required>
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-magnifying-glass-chart"></i> Generate
                </button>
            </form>
        </div>

        <!-- CHARTS GRID (2x2 Layout) -->
        <div class="dashboard-grid">

            <!-- Chart 1: Grade Distribution (Static) -->
            <div class="chart-card">
                <h2 class="chart-title"><i class="fa-solid fa-chart-column"></i> Grade Distribution</h2>
                <div class="chart-img-container">
                    <img src="/report_gd/grade_distribution" alt="Grade Distribution Chart">
                </div>
            </div>

            <!-- Chart 2: Course Difficulty (Static with Time) -->
            <div class="chart-card">
                <h2 class="chart-title"><i class="fa-solid fa-layer-group"></i> Course Difficulty</h2>
                <div class="chart-img-container">
                    <img src="/report_cd/course_difficulty?time={{ moment }}" alt="Course Difficulty Chart">
                </div>
            </div>

            <!-- Chart 3: GPA Trend (Dynamic based on Student ID) -->
            <div class="chart-card">
                <h2 class="chart-title"><i class="fa-solid fa-chart-line"></i> GPA Trend</h2>
                <div class="chart-img-container">
                   
                    <div id="trend-placeholder"
                        style="text-align: center; color: #64748b; display: flex; flex-direction: column; align-items: center;">
                        <i class="fa-solid fa-id-badge"
                            style="font-size: 3rem; margin-bottom: 12px; color: #cbd5e1;"></i>
                        <span style="font-weight: 500;">Enter Student ID to view GPA Trend</span>
                    </div>
               
                    <img id="trend-chart" alt="GPA Trend" style="display: none;">
                </div>
            </div>

            <!-- Chart 4: Radar Chart (Dynamic based on Student ID) -->
            <div class="chart-card">
                <h2 class="chart-title"><i class="fa-solid fa-spider"></i> Radar Chart</h2>
                <div class="chart-img-container">
         
                    <div id="radar-placeholder"
                        style="text-align: center; color: #64748b; display: flex; flex-direction: column; align-items: center;">
                        <i class="fa-solid fa-id-badge"
                            style="font-size: 3rem; margin-bottom: 12px; color: #cbd5e1;"></i>
                        <span style="font-weight: 500;">Enter Student ID to view Radar Chart</span>
                    </div>
            
                    <img id="radar-chart" alt="Radar Chart" style="display: none;">
                </div>
            </div>

        </div>

        <script>
            function generateStudentCharts(event) {
              
                event.preventDefault();

                const studentId = document.getElementById('student-id-input').value.trim();

                if (studentId) {
              
                    const trendImg = document.getElementById('trend-chart');
                    const radarImg = document.getElementById('radar-chart');

                    trendImg.classList.remove('empty-chart');
                    radarImg.classList.remove('empty-chart');

                    trendImg.src = '/report_gpa/gpa_trend/' + studentId;
                    radarImg.src = '/report_r/radar/' + studentId;
                }
            }
        </script>

</body>

</html>
